plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    mods {
        packsage {
            sourceSet(sourceSets.main)
        }
    }
    unitTest {
        enable()
        testedMod = mods.packsage
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    compileOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    jarJar(implementation('com.knuddels:jtokkit')) {
        version {
            strictly '[1.1.0,1.2.0)'
            prefer '1.1.0'
        }
    }
    jarJar(implementation('org.xerial:sqlite-jdbc')) {
        version {
            strictly '[3.46.1.0,4)'
            prefer '3.46.1.3'
        }
    }
    testImplementation('com.google.code.gson:gson:2.10.1')
    testImplementation('org.junit.jupiter:junit-jupiter:5.11.3')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.11.3')
    testRuntimeOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    testRuntimeOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
}

configurations.testCompileOnly.extendsFrom(configurations.compileOnly)

sourceSets {
    bootstrap {
        java.srcDir('src/bootstrap/java')
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform {
        excludeTags 'without-jei'
    }
    finalizedBy 'testWithoutJei'
}

tasks.register('testWithoutJei', Test) {
    group = 'verification'
    description = 'Runs the non-JEI tests with all JEI artifacts removed.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath - configurations.testRuntimeClasspath.incoming.artifactView {
        componentFilter { id -> id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier && id.group == 'mezz.jei' }
    }.files
    useJUnitPlatform()

    // These fixtures deliberately load JEI APIs, including the supported-version provider construction test.
    exclude 'dev/packsage/jei/**'
    filter.excludeTestsMatching('dev.packsage.client.JeiSupportTest.bookmarkProviderLoadsOnlyOnBookmarkCapableJei')

    // Keep ModDevGradle's transformed Minecraft test environment for this second run.
    def normalTest = tasks.named('test', Test).get()
    systemProperties normalTest.systemProperties
    jvmArgs normalTest.jvmArgs
    jvmArgumentProviders.addAll(normalTest.jvmArgumentProviders)
    workingDir = normalTest.workingDir
    dependsOn 'testClasses', 'prepareNeoForgeTestFiles'
}

if (project.hasProperty('packsageBootstrapOnly')) {
    sourceSets.main.java.srcDirs = [sourceSets.main.java.srcDirs, sourceSets.bootstrap.java.srcDirs].flatten()
    sourceSets.main.java.setIncludes([
            'dev/packsage/PackSage.java',
            'dev/packsage/PackSageLog.java',
            'dev/packsage/knowledge/Evidence.java',
            'dev/packsage/knowledge/Toolbox.java',
            'dev/packsage/knowledge/AdapterRegistry.java',
            'dev/packsage/model/ModelBackend.java',
            'dev/packsage/model/GroundingInstructions.java',
            'dev/packsage/model/PackSageTools.java',
            'dev/packsage/model/chatgpt/*.java',
            'dev/packsage/chat/ChatContracts.java',
            'dev/packsage/chat/ChatActions.java',
            'dev/packsage/chat/PackSageSettings.java'])
    def productionEntrypoint = file('src/main/java/dev/packsage/PackSage.java').absolutePath
    sourceSets.main.java.exclude { details -> details.file.absolutePath == productionEntrypoint }
    sourceSets.main.resources.setIncludes(['META-INF/neoforge.mods.toml', 'pack.mcmeta', 'assets/packsage/lang/en_us.json'])
    sourceSets.test.java.setIncludes(['dev/packsage/knowledge/EvidenceContractTest.java', 'dev/packsage/chat/ChatContractsTest.java', 'dev/packsage/model/chatgpt/*.java'])
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes('Automatic-Module-Name': 'dev.packsage', 'Implementation-Version': project.version)
    }
}
